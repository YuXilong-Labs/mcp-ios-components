# MCP iOS Components Nginx 配置
# 提供 HTTPS 终结、速率限制、日志记录

# 速率限制区域
limit_req_zone $binary_remote_addr zone=mcp_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mcp_webhook:10m rate=5r/s;

# 上游服务
upstream mcp_backend {
    server mcp:8900;
    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name _;
    
    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    server_name _;
    
    # SSL 配置
    ssl_certificate /etc/ssl/certs/mcp.crt;
    ssl_certificate_key /etc/ssl/private/mcp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # 日志
    access_log /var/log/nginx/mcp_access.log;
    error_log /var/log/nginx/mcp_error.log;
    
    # 通用代理设置
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    
    # 健康检查（无限制）
    location /webhook/health {
        proxy_pass http://mcp_backend;
    }
    
    # Webhook 端点（中等限制）
    location /webhook/ {
        limit_req zone=mcp_webhook burst=10 nodelay;
        proxy_pass http://mcp_backend;
    }
    
    # MCP API 端点（速率限制）
    location /mcp {
        limit_req zone=mcp_api burst=20 nodelay;
        proxy_pass http://mcp_backend;
        
        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    
    # 其他请求
    location / {
        limit_req zone=mcp_api burst=20 nodelay;
        proxy_pass http://mcp_backend;
    }
    
    # 拒绝访问敏感文件
    location ~ /\. {
        deny all;
    }
}
